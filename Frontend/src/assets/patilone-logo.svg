<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Background square with rounded corners -->
  <rect width="40" height="40" rx="8" fill="#111827"/>
  <!-- Geometric "P" monogram: vertical bar + top arc -->
  <!-- Vertical stem -->
  <rect x="11" y="10" width="4" height="20" rx="1.5" fill="white"/>
  <!-- Top horizontal bar -->
  <rect x="11" y="10" width="13" height="4" rx="1.5" fill="white"/>
  <!-- Middle horizontal bar -->
  <rect x="11" y="20" width="13" height="4" rx="1.5" fill="white"/>
  <!-- Right arc connector top -->
  <rect x="20" y="10" width="4" height="14" rx="1.5" fill="white"/>
  <!-- Accent dot — violet -->
  <circle cx="29" cy="30" r="3" fill="#6558D9"/>
</svg>
